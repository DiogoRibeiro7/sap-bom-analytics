[tool.poetry]
name = "sap-bom-analytics"
version = "0.1.1"
description = "Auditable ingestion, reconciliation, classification, and analytics for SAP-derived Bills of Materials."
authors = ["Diogo Ribeiro"]
homepage = "https://github.com/DiogoRibeiro7/sap-bom-analytics"
repository = "https://github.com/DiogoRibeiro7/sap-bom-analytics"
documentation = "https://DiogoRibeiro7.github.io/sap-bom-analytics/"
keywords = ["sap", "bom", "bill-of-materials", "analytics", "data-engineering", "packaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
readme = "README.md"
packages = [{ include = "sap_bom_analytics", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pyarrow = ">=23.0.1,<26.0"
openpyxl = ">=3.1,<4.0"

[tool.poetry.scripts]
sap-bom = "sap_bom_analytics.cli:main"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.10,<3.0"
pytest = ">=8.0,<10.0"
ruff = ">=0.9,<1.0"
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.7.7,<10.0"
pymdown-extensions = ">=11.0.2,<12.0"
hypothesis = ">=6.130,<7.0"
markdown = ">=3.8.1,<4.0"
pip-audit = ">=2.10.1,<3.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
