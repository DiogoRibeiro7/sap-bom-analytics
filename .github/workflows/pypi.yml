name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag to publish"
        required: true
        default: "v0.1.1"
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish existing release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve and verify version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"

          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["tool"]["poetry"]["version"])
          PY
          )"

          INIT_VERSION="$(python - <<'PY'
          from pathlib import Path
          import re

          text = Path("src/sap_bom_analytics/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if match is None:
              raise SystemExit("__version__ not found")
          print(match.group(1))
          PY
          )"

          test "$PACKAGE_VERSION" = "$VERSION"
          test "$INIT_VERSION" = "$VERSION"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download exact GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist

          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Verify distribution filenames
        shell: bash
        run: |
          set -euo pipefail

          test -f "dist/sap_bom_analytics-${VERSION}-py3-none-any.whl"
          test -f "dist/sap_bom_analytics-${VERSION}.tar.gz"

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
