name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction


      - name: Audit Python dependencies
        run: |
          poetry run python -m pip freeze --exclude-editable > /tmp/requirements-audit.txt
          poetry run pip-audit \
            --strict \
            --progress-spinner off \
            --no-deps \
            --requirement /tmp/requirements-audit.txt

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy src scripts

      - name: Unit tests
        run: poetry run pytest

      - name: Build documentation
        run: poetry run mkdocs build --strict

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Start PostgreSQL
        run: make db-up

      - name: Apply migrations
        run: make db-migrate

      - name: Ingest synthetic SAP extracts
        run: make sap-ingest-example

      - name: Run full synthetic pipeline
        run: |
          make staging-refresh
          make staging-smoke
          make core-refresh
          make core-smoke
          make cycle-smoke
          make classification-refresh
          make classification-smoke
          make classification-conflict-smoke
          make packaging-smoke
          make packaging-review-smoke
          make analytics-smoke

      - name: Verify idempotency
        run: make idempotency-check

      - name: Verify incremental ingestion
        run: make incremental-smoke

      - name: Verify BOM explosion performance
        run: make performance-smoke

      - name: Apply least-privilege roles
        run: make security-apply

      - name: Verify database role boundaries
        run: make security-smoke

      - name: Verify CLI observability
        run: |
          poetry run sap-bom reconcile
          poetry run sap-bom summary processing-summary

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs db
