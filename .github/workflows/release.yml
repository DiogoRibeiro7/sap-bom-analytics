name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - ".release/v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            CREATE_TAG="false"
          else
            MARKER_PATH="$(find .release -maxdepth 1 -type f -name 'v*.*.*' | sort -V | tail -1)"
            test -n "$MARKER_PATH"
            RELEASE_TAG="$(basename "$MARKER_PATH")"
            MARKER_VALUE="$(tr -d '[:space:]' < "$MARKER_PATH")"
            test "$MARKER_VALUE" = "$RELEASE_TAG"
            CREATE_TAG="true"
          fi

          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          echo "CREATE_TAG=$CREATE_TAG" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["tool"]["poetry"]["version"])
          PY
          )"

          INIT_VERSION="$(python - <<'PY'
          from pathlib import Path
          import re

          text = Path("src/sap_bom_analytics/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if match is None:
              raise SystemExit("__version__ not found")
          print(match.group(1))
          PY
          )"

          test "$PACKAGE_VERSION" = "$VERSION"
          test "$INIT_VERSION" = "$VERSION"
          test -f "$NOTES_FILE"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run quality checks
        run: |
          poetry run ruff check .
          poetry run mypy src scripts
          poetry run pytest
          poetry run mkdocs build --strict

      - name: Build wheel and source distribution
        run: poetry build

      - name: Generate SHA-256 checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create release tag
        if: env.CREATE_TAG == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sap-bom-analytics-${{ env.RELEASE_TAG }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; skipping publication."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --title "SAP BOM Analytics $VERSION" \
            --notes-file "$NOTES_FILE"
